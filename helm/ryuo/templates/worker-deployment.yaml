apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ryuo.fullname" . }}-worker
  labels:
    {{- include "ryuo.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "ryuo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "ryuo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "ryuo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ include "ryuo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["--mode", "worker"]
          envFrom:
            - configMapRef:
                name: {{ include "ryuo.fullname" . }}-config
          env:
            - name: RYUO_MODE
              value: worker
            - name: RYUO_CONTROLLER_URL
              value: "{{ include "ryuo.fullname" . }}-controller:{{ .Values.service.grpcPort }}"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ include "ryuo.fullname" . }}-postgresql
                  key: password
                  {{- else }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.secretKey }}
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "ryuo.databaseUrl" . | quote }}
            {{- with .Values.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pgrep", "-x", "ryuo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pgrep", "-x", "ryuo"]
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            {{- include "ryuo.dagVolumeMounts" . | nindent 12 }}
            - name: plugins
              mountPath: /app/plugins
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "ryuo.dagVolumes" . | nindent 8 }}
        - name: plugins
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
