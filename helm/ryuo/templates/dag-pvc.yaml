{{- if eq .Values.dagStorage.type "pvc" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ryuo.fullname" . }}-dags
  labels:
    {{- include "ryuo.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.dagStorage.pvc.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dagStorage.pvc.size }}
  {{- if .Values.dagStorage.pvc.storageClass }}
  storageClassName: {{ .Values.dagStorage.pvc.storageClass | quote }}
  {{- end }}
{{- end }}
