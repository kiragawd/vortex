apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ryuo.fullname" . }}-controller
  labels:
    {{- include "ryuo.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  serviceName: {{ include "ryuo.fullname" . }}-controller
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "ryuo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "ryuo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "ryuo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # INFRA-10: Run database migrations before controller starts
      initContainers:
        - name: run-migrations
          image: "{{ .Values.image.repository }}:{{ include "ryuo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/ryuo", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ include "ryuo.fullname" . }}-postgresql
                  key: password
                  {{- else }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.secretKey }}
                  {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ include "ryuo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["--mode", "controller"]
          envFrom:
            - configMapRef:
                name: {{ include "ryuo.fullname" . }}-config
          env:
            - name: RYUO_MODE
              value: controller
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgresql.enabled }}
                  name: {{ include "ryuo.fullname" . }}-postgresql
                  key: password
                  {{- else }}
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.secretKey }}
                  {{- end }}
            - name: DATABASE_URL
              value: {{ include "ryuo.databaseUrl" . | quote }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          volumeMounts:
            {{- include "ryuo.dagVolumeMounts" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "ryuo.dagVolumes" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
