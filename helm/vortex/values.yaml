# -- Global image settings
image:
  repository: ghcr.io/vortex/vortex
  tag: ""  # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Controller (scheduler + API server)
controller:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -- Worker (task executor, horizontally scalable)
worker:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# -- Service configuration
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 50051

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: vortex.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- PostgreSQL (Bitnami subchart or external)
postgresql:
  enabled: true
  auth:
    database: vortex
    username: vortex
    existingSecret: ""
  primary:
    persistence:
      size: 10Gi

# External database (when postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  database: vortex
  username: vortex
  existingSecret: ""
  secretKey: password

# -- DAG storage
dagStorage:
  # "pvc" for PersistentVolumeClaim, "gitsync" for git-sync sidecar
  type: pvc
  pvc:
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteMany
  gitSync:
    enabled: false
    repo: ""
    branch: main
    interval: "60s"
    image: registry.k8s.io/git-sync/git-sync:v4.2.1

# -- Prometheus ServiceMonitor
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

# -- Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- General
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -- Logging
logging:
  level: info
  format: json
