# Ryuo Docker Compose — Local Development & Testing
# Usage: docker compose up -d
# With build: docker compose up --build -d

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ryuo
      POSTGRES_USER: ryuo
      # INFRA-2: Require explicit password — no insecure default
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryuo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # INFRA-4: Resource limits
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Database Migrations (init container — runs once, then exits) ──────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["ryuo", "db", "--migrate"]
    environment:
      DATABASE_URL: postgres://ryuo:${POSTGRES_PASSWORD}@postgres:5432/ryuo
      RYUO_SECRET_KEY: ${RYUO_SECRET_KEY:-change_me_32_char_secret_key_000}
      RUST_LOG: ryuo=info
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Ryuo Controller ──────────────────────────────────────────────────
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    # INFRA-3: Removed --allow-unsafe-dag-exec (unsafe flag must not run in any environment)
    command: ["ryuo", "--swarm"]
    environment:
      RYUO_MODE: controller
      # INFRA-2: Use required variable — no insecure default password
      DATABASE_URL: postgres://ryuo:${POSTGRES_PASSWORD}@postgres:5432/ryuo
      # Vault encryption key (32 raw ASCII chars, 64 hex chars, or 44 base64 chars)
      RYUO_SECRET_KEY: ${RYUO_SECRET_KEY:-change_me_32_char_secret_key_000}
      RYUO_LOG_LEVEL: info
      RYUO_LOG_FORMAT: json
      RUST_LOG: ryuo=info
      # Migrations already applied by the `migrate` init service above
      RYUO_SKIP_AUTO_MIGRATE: "true"
      # Allow Python DAG files to be loaded via PyO3.
      # These DAGs are trusted developer-owned files mounted read-only from ./dags.
      # Do NOT set this if dag files come from untrusted external sources.
      RYUO_ALLOW_PYTHON_DAGS: "true"
    ports:
      - "3000:3000"     # HTTP API & Web UI
      - "50051:50051"   # gRPC swarm
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./dags:/app/dags:ro
      - ./plugins:/app/plugins:ro
    # INFRA-4: Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Ryuo Worker (scalable) ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["ryuo", "worker", "--controller", "http://controller:50051"]
    environment:
      RYUO_MODE: worker
      # INFRA-2: Use required variable — no insecure default password
      DATABASE_URL: postgres://ryuo:${POSTGRES_PASSWORD}@postgres:5432/ryuo
      RYUO_CONTROLLER_URL: http://controller:50051
      RYUO_LOG_LEVEL: info
      RYUO_LOG_FORMAT: json
      RUST_LOG: ryuo=info
      # Migrations already applied by the `migrate` init service
      RYUO_SKIP_AUTO_MIGRATE: "true"
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x ryuo || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./dags:/app/dags:ro
      - ./plugins:/app/plugins:ro
    # INFRA-4: Resource limits
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - controller
    restart: unless-stopped

  # ─── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
