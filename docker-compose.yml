# Vortex Docker Compose — Local Development & Testing
# Usage: docker compose up -d
# With build: docker compose up --build -d

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vortex
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vortex_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── Vortex Controller ──────────────────────────────────────────────────
  controller:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["vortex", "--swarm", "--allow-unsafe-dag-exec"]
    environment:
      VORTEX_MODE: controller
      DATABASE_URL: postgres://vortex:${POSTGRES_PASSWORD:-vortex_dev}@postgres:5432/vortex
      VORTEX_LOG_LEVEL: info
      VORTEX_LOG_FORMAT: json
      RUST_LOG: vortex=info
    ports:
      - "3000:3000"     # HTTP API & Web UI
      - "50051:50051"   # gRPC swarm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./dags:/app/dags:ro
      - ./plugins:/app/plugins:ro

  # ─── Vortex Worker (scalable) ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["vortex", "worker", "--controller", "http://controller:50051"]
    environment:
      VORTEX_MODE: worker
      DATABASE_URL: postgres://vortex:${POSTGRES_PASSWORD:-vortex_dev}@postgres:5432/vortex
      VORTEX_CONTROLLER_URL: http://controller:50051
      VORTEX_LOG_LEVEL: info
      VORTEX_LOG_FORMAT: json
      RUST_LOG: vortex=info
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x vortex || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    volumes:
      - ./dags:/app/dags:ro
      - ./plugins:/app/plugins:ro
    deploy:
      replicas: 2

  # ─── Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - controller
    restart: unless-stopped

  # ─── Grafana ────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-vortex}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  grafanadata:
